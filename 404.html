<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirigiendo...</title>
    <script type="text/javascript">
      // Este script captura la URL actual y la redirige al index.html
      // para que Angular pueda manejar la ruta sin errores.
      var path = window.location.pathname;
      window.location.replace(path + '?404=true');
    </script>
  </head>
  <body></body>
</html>
